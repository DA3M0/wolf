name: Bug report
description: Report a problem with wolf
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for your report! Please provide as much information as possible to reproduce the issue.
  - type: textarea
    id: summary
    attributes:
      label: Problem summary
      description: Briefly describe the problem you encountered.
      placeholder: Provide a clear, concise description of the problem.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide the commands and steps needed to reproduce the issue.
      placeholder: |
        1. Run ...
        2. Use ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Describe what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Describe what actually happened and include any relevant error messages.
    validations:
      required: true
  - type: input
    id: wolf-version
    attributes:
      label: wolf version
      description: Run `wolf --version` to check.
      placeholder: e.g. 1.3.0
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true
  - type: textarea
    id: model
    attributes:
      label: Model information
      description: If the issue is model-related, provide the model format, architecture, and any relevant details.
  - type: textarea
    id: logs
    attributes:
      label: Logs or additional information
      description: Paste any relevant logs. Remove sensitive information such as API keys before submitting.
      render: shell
