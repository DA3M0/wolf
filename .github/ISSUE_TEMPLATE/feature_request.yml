name: Feature request
description: Suggest a new feature or improvement
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for your suggestion! Please explain the context and how this feature would help you.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What problem would you like to solve? Describe your current use case.
      placeholder: As a ..., I want to ..., so that ...
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed solution
      description: Describe the feature you would like added or improved.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any alternative solutions you have considered.
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add relevant examples, references, or other background information.
