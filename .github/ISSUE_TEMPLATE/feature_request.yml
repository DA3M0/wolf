name: 功能需求
description: 提出新功能或改进建议
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        感谢提出建议！请说明需求背景，以及该功能将如何帮助你。
  - type: textarea
    id: problem
    attributes:
      label: 相关问题或使用场景
      description: 你希望解决什么问题？请描述目前的使用场景。
      placeholder: 作为一名 ...，我希望 ...，这样就可以 ...
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: 建议的解决方案
      description: 描述你希望新增或改进的功能。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 描述你考虑过的其他解决方式（如果有）。
  - type: textarea
    id: additional-context
    attributes:
      label: 补充信息
      description: 添加相关示例、参考资料或其他背景信息。
