[package]
name = "wolf"
version = "1.2.1"
edition = "2024"
description = "Local LLM chat and model inspection CLI powered by llama.cpp"
license = "Apache-2.0"
repository = "https://github.com/DA3M0/wolf"
readme = "README.md"
keywords = ["llm", "gguf", "llama-cpp", "chat", "cli"]
categories = ["command-line-utilities"]

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev]
debug = "line-tables-only"

[features]
default = ["openmp"]
openmp = ["llama-cpp-4/openmp"]
vulkan = ["llama-cpp-4/vulkan"]
cuda = ["llama-cpp-4/cuda"]
rocm = ["llama-cpp-4/hip"]
metal = ["llama-cpp-4/metal"]

[dependencies]
ctrlc = "3"
encoding_rs = "0.8"
llama-cpp-4 = { version = "0.8.0", default-features = false }
memmap2 = "0.9.11"
rayon = "1.12.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.145"
